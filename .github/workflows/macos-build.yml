name: macOS Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "agent/**"
      - "release.sh"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test --workspace
      - run: chmod +x release.sh && ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FM27-Training-Assistant-macOS
          path: dist/FM27-Training-Assistant-macOS.dmg
      - name: Publish macOS DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FM27-Training-Assistant-macOS.dmg --clobber
          else
            gh release create "$TAG" dist/FM27-Training-Assistant-macOS.dmg --title "$TAG" --generate-notes
          fi
