# Builds FM27 Training Assistant for macOS (universal .dmg) and Windows (.zip).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: [all, windows, macos]
        default: all

permissions:
  contents: write

jobs:
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Certificate in temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - name: Notarization profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: env.APPLE_ID != ''
        run: xcrun notarytool store-credentials fm27-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - run: cargo test --workspace
      - run: chmod +x release.sh && ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FM27-Training-Assistant-macOS
          path: dist/FM27-Training-Assistant-macOS.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/FM27-Training-Assistant-macOS.dmg
          generate_release_notes: true

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p fm27-trainer
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/fm27-trainer.exe "dist/FM27 Training Assistant.exe"
          Compress-Archive -Path "dist/FM27 Training Assistant.exe" -DestinationPath "dist/FM27-Training-Assistant-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FM27-Training-Assistant-Windows
          path: dist/FM27-Training-Assistant-Windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/FM27-Training-Assistant-Windows.zip
          generate_release_notes: true
